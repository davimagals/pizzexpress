<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza | Pizzexpress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mooli&family=Moul&family=Moulpali&family=Mukta+Malar:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pizza.css" />
  </head>
  <body
    style="
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
        url(assets/img/pizzas/calabresa.png);
    "
  >
    <div id="barra">
      <a href="destaques.html">
        <img id="seta-voltar" src="assets/img/arrow.png" />
      </a>
    </div>

    <img id="imagem" src="assets/img/pizzas/calabresa.png" />

    <h2 id="titulo">Pizza de Calabresa</h2>

    <div id="informacoes">
      <h3>Pizza de Calabresa</h3>
      <div id="preco">
        <span>Preço</span>
        <span id="valor">R$ 25,00</span>
      </div>
      <div id="desc">
        <span>Descrição</span>
        <ul>
          <li>Calabresa</li>
          <li>Queijo</li>
          <li>Cebola</li>
          <li>Alho</li>
        </ul>
      </div>
    </div>

    <button id="comprar">Comprar</button>
  </body>
</html>
